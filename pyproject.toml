[project]
name = "plane-mcp-karval"
version = "0.1.0"
description = "Karval-owned Plane MCP server with full registry coverage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13,<3",
]

[project.scripts]
plane-mcp-karval = "plane_mcp_karval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_mcp_karval", "src/plane_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/plane_api/operation_registry.json" = "plane_api/operation_registry.json"
"src/plane_api/source_contract.json" = "plane_api/source_contract.json"
"src/plane_mcp_karval/assets/icon-registry.v1.json" = "plane_mcp_karval/assets/icon-registry.v1.json"
