[project]
name = "plane-mcp-karval"
version = "0.3.3"
description = "Karval-owned Plane MCP server with full registry coverage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13,<3",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
plane-mcp-karval = "plane_mcp_karval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_mcp_karval", "src/plane_api"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY.md" = "plane_api/THIRD_PARTY.md"
"licenses/Apache-2.0.txt" = "plane_api/licenses/Apache-2.0.txt"
"skills/plane-mcp-operations" = "plane_mcp_karval/skills/plane-mcp-operations"
"src/plane_api/operation_registry.json" = "plane_api/operation_registry.json"
"src/plane_api/source_contract.json" = "plane_api/source_contract.json"
"src/plane_mcp_karval/assets/icon-registry.v1.json" = "plane_mcp_karval/assets/icon-registry.v1.json"
